[project]
name = "spectrek-fsp-backend"
version = "0.1.0"
description = "Платформа подбора ИТ-специалистов с обратной механикой (спецтрек ФСП, ЛЦТ 2026)"
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

# Покрытие (pytest-cov): `python -m pytest --cov=app`; в CI — тот же запуск с отчётами xml/html (docs/testing.md).
# Порог: сборка падает, если покрытие строк пакета app ниже fail_under. Сейчас около 84 %.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
precision = 1
skip_empty = true
exclude_also = ["if __name__ == .__main__.:"]
