  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: конвейер
    обновления данных выбирается по годовой цене — инфраструктура и дежурства плюс потери от задержки (средняя задержка
    = половина периода запусков + обработка, у потоковых — их задержка) × число событий × цена часа. Верный вариант
    распределён поровну; ловушки — «максимальная свежесть», «дешевле всего» и расчёт без цены дежурств — отличаются
    от ответа хотя бы в двух случаях (если верна сама ловушка — хотя бы в одном). Lead обычно выбирает поток «ради
    свежести» или оставляет ночную загрузку; Principal переводит задержку в деньги — граница Lead/Principal (θ ≈
    2,9); σ 0,3'
