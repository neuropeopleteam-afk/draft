family_id: backend.arch.outbox_relay_fix
title: Событие о каждом зафиксированном изменении — outbox в той же транзакции, порядок и «хотя бы раз» при падении в любой точке
direction: backend
skills: [transactions, distributed_systems, reliability, data_consistency, architecture]
target_grades: [lead]
format: choose_fix
language: python
invariants:
  code_lines: [6, 12]
  n_options: 4
  defect_type: dual_write
  extra:
    distractors_fixed: [mark_before, publish_in_tx, sorted_ids]
    crash_points: every_db_and_broker_call
time_limit_s: 720
canary: false
prior_difficulty:
  b: 1.9
  a: 1.3
  sigma_variant: 0.25
  basis: "Априорная трудность (не по людям). Четыре больших фрагмента (14–18 строк) с одинаковой структурой; каждый дистрактор нарушает ровно одно из трёх свойств: «хотя бы раз» (отметка до публикации), «нет событий без фиксации» (публикация внутри транзакции), «порядок событий сущности» (сортировка по строковому id, при которой второе событие по алфавиту раньше первого). Нужно проиграть падение процесса в каждой точке и заметить неочевидную сортировку. Senior обычно знает outbox, но выбирает «отметку до публикации» как защиту от двойной отправки или не видит порядок — граница Senior/Lead (θ ≈ 2,0). Состав дистракторов фиксирован, σ 0,25"
generator: assessment_bank.families.backend.arch_outbox_relay_fix
version: 1
description: >
  Lead: замена модуля «изменение + событие» на transactional outbox с ретранслятором. Ключ — исполнением:
  модель базы с транзакциями и брокера, падение процесса в каждой точке, перезапуск, проверка инвариантов
  (хотя бы раз, нет событий без фиксации, порядок событий сущности).
