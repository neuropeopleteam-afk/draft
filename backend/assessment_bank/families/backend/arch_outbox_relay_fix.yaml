description: 'Lead: замена модуля «изменение + событие» на transactional outbox с ретранслятором. Ключ — исполнением:
  модель базы с транзакциями и брокера, падение процесса в каждой точке, перезапуск, проверка инвариантов (хотя
  бы раз, нет событий без фиксации, порядок событий сущности).

