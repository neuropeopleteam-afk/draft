  basis: 'Априорная, до калибровки на людях (a = 1,3). Четыре больших фрагмента (14–18 строк), построенные по схеме
    2×2: верный и три варианта с одним или двумя нарушенными правилами из пула (отметка до публикации, сортировка
    по строковому id, публикация внутри транзакции, outbox отдельной транзакцией). Варианты отличаются на одну-две
    строки, ключ не угадывается по форме; нужно проиграть падение процесса в каждой точке и заметить неочевидную
    сортировку. Senior обычно знает outbox, но выбирает «отметку до публикации» как защиту от двойной отправки или
    не видит порядок — граница Senior/Lead (θ ≈ 2,0). σ 0,25'
