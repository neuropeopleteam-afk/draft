  basis: "Априорная трудность (не по людям). Решение по риску с двумя источниками потерь: дефектные выкладки (ограничиваются первой волной — канарейкой или ячейкой — с вероятностью заметить) и отказы общей зависимости (ограничиваются только ячейками); ожидаемая цена = доплата + потери, верный вариант меняется между вариантами, ловушки — «без доплаты», «максимальная защита», учёт только выкладок, только отказов зависимостей — отличаются от ответа минимум в двух случаях. Lead обычно выбирает ячейки «по лучшей практике» или канарейку, не считая отказов зависимостей, — граница Lead/Principal (θ ≈ 2,75). σ 0,3"
