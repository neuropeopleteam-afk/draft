description: 'Кэш cache-aside для значения, зависящего от id и второго параметра (валюта, тариф, период). Одна строка
  нарушает согласованность: ключ без параметра или неверная инвалидация. Кандидат по последовательности вызовов
  и неверному ответу находит строку. Ответы считает модель кэша; дефектный код падает на тесте, исправленный проходит.
  Версия 2: только подтипы инвалидации (удаление не того ключа / константного ключа); подтип «ключ без параметра»:
  две разные выборки попадают в одну запись кэша — семейство backend.cache.key_params_bug.'
