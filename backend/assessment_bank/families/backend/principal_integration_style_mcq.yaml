  basis: "Априорная трудность (не по людям). Короткое расчётное задание у границы Lead/Principal: перестройка синхронной цепочки оформления заказа выбирается по ожидаемой годовой цене — доплата, потерянные заказы (1 − ΠAᵢ по всей цепочке, по критичным вызовам или без объединённых сервисов) и цена компенсаций у саги. Верный вариант распределён поровну по четырём; ловушки — «без доплаты», «асинхронно — лучшая практика» и сага без цены компенсаций — отличаются от ответа хотя бы в двух случаях (если верен сам вариант-ловушка — хотя бы в одном). Lead обычно выбирает очередь и сагу «по учебнику»; Principal считает, что компенсации и доплата съедают выигрыш, — граница Lead/Principal (θ ≈ 2,9); σ 0,3"
