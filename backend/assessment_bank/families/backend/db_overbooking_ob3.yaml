description: >
  Обработчик бронирования в режиме autocommit проверяет свободные места в Python и затем
  пишет. Шаг 1 — порядок запросов двух одновременных бронирований, дающий перепродажу
  (воспроизводится детерминированно по расписанию); шаг 2 — атомарное исправление;
  шаг 3 — транзакции и блокировки в PostgreSQL, повторы при 40001, масштабирование
  «горячего» события или удержание брони с истечением.
