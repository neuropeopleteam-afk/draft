  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: схема
    чтений реплицированной базы выбирается по сумме цен — инфраструктура, устаревшие чтения сразу после собственной
    записи (только эта доля страдает от отставания реплик), доля нагрузки на лидера у «чтения своих записей» и потеря
    выручки от задержки записи у синхронного кворума. Верный вариант распределён поровну; ловушки — «строгая согласованность
    всегда», «самое дешёвое железо», синхронная репликация без цены задержки — отличаются от ответа хотя бы в двух
    случаях (если верна сама ловушка — хотя бы в одном). Lead обычно выбирает строгую согласованность или реплики
    целиком; Principal видит, что устаревание бьёт только по чтениям после своей записи, — граница Lead/Principal
    (θ ≈ 3,0); σ 0,3'
