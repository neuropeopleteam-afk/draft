description: >
  Самописный раннер миграций сортирует имена файлов; без ведущих нулей миграция «10_…»
  выполняется раньше «2_…» и может упасть на отсутствующей таблице или столбце. Кандидат
  предсказывает вывод раннера. Ключ — независимая модель, сверка исполнением в sqlite3.
