  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: модель
    обработки запросов выбирается по годовой цене инстансов на пик — число инстансов равно максимуму из ограничения
    потоков (закон Литтла: λ × (c + w) / пул) и процессора, с округлением вверх, плюс доплаты за переписывание или
    очередь. Верный вариант распределён поровну; ловушки — «асинхронный ввод-вывод всегда выгоднее», «без переписывания»
    и расчёт только по процессору — отличаются от ответа хотя бы в двух случаях (если верна сама ловушка — хотя
    бы в одном). Lead обычно выбирает асинхронность «по умолчанию» или наращивает пул; Principal считает оба ограничения
    и цену перехода — граница Lead/Principal (θ ≈ 3,0); σ 0,3'
