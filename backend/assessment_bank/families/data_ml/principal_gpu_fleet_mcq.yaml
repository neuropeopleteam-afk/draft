    меняется. Senior обычно считает по пиковой нагрузке, но теряет потерю зоны или выбирает пакет по пропускной
    способности; бюджет мощности на год с отказоустойчивостью — граница Lead/Principal (θ ≈ 2,4). Короткое задание
    (≤ 7 мин). σ 0,3'
