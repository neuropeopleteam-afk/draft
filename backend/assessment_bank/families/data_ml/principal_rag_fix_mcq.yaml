  basis: 'Априорная, до калибровки на людях (a = 1,0). Решение по системе RAG через разложение качества: доля верных
    ответов = полнота поиска × точность читателя; каждая мера двигает свою часть (переранжирование — полноту через
    k = 50, больше контекста — полноту, но снижает точность, гибридный поиск — полноту, модель сильнее — точность)
    и добавляет задержку. Ответ равновероятен среди четырёх; ловушки — самая дешёвая, наибольшая доля верных, «больше
    контекста — не хуже», без бюджета задержки — отличаются от ответа минимум в двух случаях. Lead обычно берёт
    модель сильнее или больше контекста, не раскладывая качество на поиск и чтение, — граница Lead/Principal (θ
    ≈ 2,5). Короткое задание (≤ 7 мин). σ 0,3'
