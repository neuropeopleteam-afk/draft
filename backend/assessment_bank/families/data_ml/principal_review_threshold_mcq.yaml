  basis: 'Априорная, до калибровки на людях (a = 1,0). Порог модели как бизнес-решение: по таблице корзин скора
    — объём проверки против мощности отдела, цена проверки, потери на честных клиентах и остаточный ущерб от неполноты
    проверки против ущерба автоодобрения. Ответ равновероятен по месту среди четырёх порогов; ловушки — без ограничения
    мощности, без потерь на честных, «проверка ловит всё», самый строгий порог — отличаются от ответа минимум в
    двух случаях (у крайних — в одном). Lead обычно выбирает порог по F1 или по точности, не переводя ошибки в деньги
    и не проверяя мощность, — граница Lead/Principal (θ ≈ 2,4). Короткое задание (≤ 7 мин). σ 0,3'
