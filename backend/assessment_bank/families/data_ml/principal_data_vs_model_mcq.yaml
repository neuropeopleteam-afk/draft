  basis: 'Априорная, до калибровки на людях (a = 1,0). Решение о вложении в качество модели по разложению ошибки:
    шум разметки, пол ёмкости и устранимая данными часть; каждая мера двигает только свою часть, у данных — убывающая
    отдача (k и k²), у большей модели — рост устранимой части на тех же данных. Ответ равновероятен среди четырёх
    мер; ловушки — самая дешёвая, наибольшее снижение, «вся ошибка устранима данными», модель больше без роста устранимой
    части — отличаются от ответа минимум в двух случаях. Lead обычно выбирает «больше данных» или «модель больше»
    по привычке, не раскладывая ошибку, — граница Lead/Principal (θ ≈ 2,5). Короткое задание (≤ 7 мин). σ 0,3'
