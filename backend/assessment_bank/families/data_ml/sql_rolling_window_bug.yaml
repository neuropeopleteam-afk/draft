description: 'Признак «скользящая сумма/среднее за k дней по объекту» на оконных функциях. Дефекты: рамка из k+1
  строк, нет PARTITION BY или окно смотрит в будущее. Запрос исполняется в sqlite3 дословно, результат сверяется
  с независимым расчётом. Версия 2: только подтипы рамки (ошибка на единицу, рамка в будущее); подтип «нет PARTITION
  BY»: окно смешивает группы — семейство data_ml.sql.rolling_partition_bug.'
