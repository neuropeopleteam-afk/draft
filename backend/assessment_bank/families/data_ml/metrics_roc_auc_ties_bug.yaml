  basis: 'Априорная, до калибровки на людях (a = 1,3). 13–15 строк; нужно знать определение ROC-AUC как вероятности
    упорядочивания пары с весом 0,5 для ничьей и его ранговую форму (Манн — Уитни со средними рангами); пример расхождения
    со sklearn дан в условии. Ранговые подтипы (порядковый/минимальный ранг) заметно труднее попарных — σ повышена
    (Middle/Senior). Калибровка панелью LLM 05.10: варианты неизоморфны (σ > 0,5, χ² p < 0,01), разброс объяснялся
    подтипом; оставлены ранговые подтипы (порядковый и минимальный ранг вместо среднего), второй подтип выделен
    в data_ml.metrics.auc_pairwise_ties_bug; σ снижена до 0,3.'
