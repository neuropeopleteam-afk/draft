description: 'Собственная функция ROC-AUC расходится со sklearn на данных с одинаковыми скорами. Попарная реализация
  засчитывает ничью как победу, ранговая — присваивает в группе равных скоров не средний ранг. Ключ проверяется
  исполнением на эталонных значениях. Версия 2: только ранговые подтипы (порядковый и минимальный ранг вместо среднего);
  попарный подтип «>= вместо >» (ветка ничьей недостижима); подтип «вес ничьей 1,0» исключён: неверная константа
  рядом с определением — подсказка (доля верных 0,69 против 0,12–0,36) — семейство data_ml.metrics.auc_pairwise_ties_bug.'
