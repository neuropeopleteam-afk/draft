  basis: 'Априорная, до калибровки на людях (a = 1,3). Система оценки целиком: эталонный набор по срезам и его размер
    по нужной точности (n ≈ 1,96² · p(1 − p) / m²), модель-судья с калибровкой по разметке людей, ворота регрессии
