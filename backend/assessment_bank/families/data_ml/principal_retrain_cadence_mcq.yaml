  basis: 'Априорная, до калибровки на людях (a = 1,0). Экономика жизненного цикла модели: средняя цена в неделю
    = (переобучение + проверка модельного риска + ожидаемая цена неудачной выкатки) / T + потери от дрейфа, растущие
    внутри цикла (среднее (T − 1)/2 недели); опоздание разметки — постоянная, выбор не меняет (лишнее условие).
    Ответ равновероятен среди четырёх периодов; ловушки — без риска выкатки, без проверки, потери по концу цикла
    (сдвигают к коротким периодам), без роста потерь внутри цикла (к длинным) — отличаются от ответа минимум в двух
    случаях (у крайних периодов — в одном). Lead обычно назначает период «по привычке» (раз в месяц) или учитывает
    только цену вычислений — граница Lead/Principal (θ ≈ 2,4). Короткое задание (≤ 7 мин). σ 0,3'
