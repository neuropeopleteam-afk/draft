description: 'Набор t21 (короткие практические у порогов, 21.10). Лог событий воронки (магазин, онбординг, B2B,
  бронирования) и запрос CTE с LEAD() OVER (PARTITION BY user_id ORDER BY day) + подсчёт переходов по пользователям;
