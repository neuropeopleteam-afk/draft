description: 'Набор t21 (короткие практические у порогов, 21.10). Заказы / платежи / поездки / бронирования
  пользователей вперемешку; CTE с ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at) и выбор rn = 1 с
  фильтром статуса снаружи или внутри; предсказать строки результата. Ключ — независимый расчёт в генераторе,
