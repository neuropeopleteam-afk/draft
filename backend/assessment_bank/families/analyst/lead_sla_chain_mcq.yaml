  basis: 'Априорная, до калибровки на людях (a = 1,0). Нужно перевести требование к доступности операции в произведение
    по синхронной цепочке, исключить асинхронный сервис (очередь), посчитать эффект резервирования 1 − (1 − a)²
    и вынос из цепочки, затем выбрать достаточное, а не максимальное и не самое дешёвое вообще. Числа подобраны
    так, что каждая из ловушек (асинхронный сервис в произведении, самое дешёвое, самое сильное) ведёт к другому
    ответу. Senior считает цепочку, Lead — выбирает решение по бюджету и требованию: у порога Senior/Lead'
