description: 'Сервис аренды с TTL выдаёт fencing-токены, хранилище отклоняет запись с меньшим токеном. Дефект: токен
  переиспользуется при выдаче аренды поверх истёкшей чужой (продление «по наличию записи», а не «тем же клиентом»),
  поэтому устаревший держатель после паузы перезаписывает данные нового. Ключ проверяется исполнением сценария «пауза
  дольше TTL».

  '
