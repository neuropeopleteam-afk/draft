  basis: "Априорная трудность (не по людям). Нужно собрать модель доступности из трёх видов звеньев (последовательные, пара реплик с переключением, необязательное с запасным ответом) и перевести долю отказов в минуты за 30 дней. Дистракторы — три типичные ошибки одной числовой формы (≥ 15 % друг от друга), верный не крайний по построению не гарантирован, но позиция буквы случайна. Senior обычно умеет перемножать последовательные звенья; учёт резерва и необязательной зависимости одновременно — граница Senior/Lead (θ ≈ 2,0). Один подтип; варьируются путь, доступности звеньев"
