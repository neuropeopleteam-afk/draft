  basis: "Априорная трудность (не по людям). Нужно собрать модель доступности из трёх видов звеньев (последовательные, пара реплик с переключением, необязательное с запасным ответом) и перевести долю отказов в минуты за 30 дней. Дистракторы — три из пяти типичных ошибок одной числовой формы (≥ 15 % друг от друга): завышающие (необязательная зависимость последовательно, реплики последовательно, без резерва) и занижающие (самое слабое звено, забыт сам сервис); место ключа по величине меняется (версия 2). Senior обычно умеет перемножать последовательные звенья; учёт резерва и необязательной зависимости одновременно — граница Senior/Lead (θ ≈ 2,0). Один подтип; варьируются путь, доступности звеньев"
generator: assessment_bank.families.common.arch_availability_chain_mcq
version: 2
description: >
  Lead: ожидаемая недоступность пути за 30 дней по доступностям сервиса, двух обязательных зависимостей,
  пары реплик базы и необязательной зависимости. Ключ — исполнением модели (перебор 2⁶ состояний).
