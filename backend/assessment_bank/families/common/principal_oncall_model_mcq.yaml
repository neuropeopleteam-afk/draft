  basis: "Априорная трудность (не по людям). Короткое расчётное задание у границы Lead/Principal: модель дежурств выбирается по годовой цене — доплаты за дежурства плюс потери от инцидентов (базовое время устранения и надбавки: пробуждение ночью, передача владельцу, передача между офисами — с учётом доли ночных инцидентов) × цена часа. Верная модель распределена поровну; ловушки — «быстрее всего устраняет», «дешевле всего по доплатам» и расчёт без ночных инцидентов — отличаются от ответа хотя бы в двух случаях (если верна сама ловушка — хотя бы в одном). Lead обычно выбирает «каждая команда сама» или центральную службу по привычке; Principal считает надбавки по времени суток — граница Lead/Principal (θ ≈ 2,9); σ 0,3"
