description: >
  Lead: основа постмортема без поиска виновных по хронологии инцидента с числами (нагрузка, доля ошибок,
  метки времени). Рубрика из четырёх критериев (влияние, причинность, обнаружение, действия) с конкретными
  числами варианта для проверки расчёта; оценка с цитатами-доказательствами.
