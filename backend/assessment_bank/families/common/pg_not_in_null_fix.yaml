  basis: 'Априорная, до калибровки на людях (a = 1,3). Навык из ключевых навыков вакансий hh.ru (postgresql), которого
    не было среди проверяемых навыков банка. Трёхзначная логика SQL в PostgreSQL: NOT IN по подзапросу с NULL даёт
