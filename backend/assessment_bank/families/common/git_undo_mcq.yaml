description: >
  Цель задана конечным состоянием репозитория; выбрать команды, которые к нему приводят. Каждый
  вариант исполняется настоящим git в одноразовом репозитории: верный даёт целевое состояние
  (ветка, история, индекс, содержимое файлов), остальные — другое.
