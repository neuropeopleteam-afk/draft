  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: доля
    ёмкости на технический долг выбирается моделированием кварталов — продуктовая работа = ёмкость × (1 − доля)
    × производительность, производительность падает от долга и растёт от работы над ним (с пределами). Верная доля
    распределена поровну; ловушки — «ничего на долг», «максимум на долг» и расчёт на два квартала — отличаются от
    ответа хотя бы в двух случаях (если верна сама ловушка — хотя бы в одном). Lead обычно называет «привычные 20
    %» или защищает продукт сейчас; Principal считает отдачу на горизонте — граница Lead/Principal (θ ≈ 2,9); σ
    0,3'
