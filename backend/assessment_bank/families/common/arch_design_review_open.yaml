description: >
  Lead: ревью дизайна нового сервиса. Пять пунктов документа, три из них — заложенные изъяны надёжности,
  ёмкости и интеграции, два — здравые решения. Рубрика по каждому изъяну (с номером пункта) и по
  ранжированию рисков без ложных тревог; оценка с цитатами-доказательствами.
