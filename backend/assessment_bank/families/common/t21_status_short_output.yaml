description: 'Набор t21 (короткие практические у порогов, 21.10). Скрипт в новом репозитории коммитит часть файлов,
  правит и добавляет в индекс остальные и печатает git status --short (пробелы заменены на «_»); предсказать
  строки статуса. Ключ — независимая модель состояний HEAD/индекс/рабочая копия в генераторе, проверка — исполнение
  скрипта раннером git в песочнице.'
