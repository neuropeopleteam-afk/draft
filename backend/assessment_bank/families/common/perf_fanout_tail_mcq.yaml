  basis: "Без кода; нужно перейти от перцентиля бэкенда к вероятности «хотя бы один из N медленный» = 1 − (1 − q)^N (усиление хвоста при fan-out, Dean & Barroso «The Tail at Scale»). N·q в диапазоне 0,3–0,9, поэтому оценка суммой заметно расходится с вероятностью; дистракторы — три типичные ошибки одной числовой формы, верный ответ не крайний. Один подтип, варьируются контекст, N, перцентиль; Senior"
