version: 1
description: >
  Запрос рассылается на N независимых бэкендов и ждёт всех; у каждого p99 (p99,5, p99,9)
  задержки равен L. Какая доля запросов медленнее L? Ключ проверяется исполнением: точный
  расчёт вероятности (Fraction) и сопоставление с вариантами.
