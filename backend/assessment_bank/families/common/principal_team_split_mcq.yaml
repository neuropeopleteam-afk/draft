  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое задание у границы Lead/Principal на социотехническую
    архитектуру: девять компонентов делятся между тремя командами, даны статические вызовы и совместные изменения
    за квартал; согласования между командами порождают совместные изменения через границы, а не вызовы. Варианты
    — схема 2×2 из двух обменов компонентами (центрального варианта нет); меньше всего вызовов через границы — у
    неверного варианта. Lead обычно режет по графу зависимостей кода; Principal проводит границы по связности изменений
    — граница Lead/Principal (θ ≈ 2,9); σ 0,3'
