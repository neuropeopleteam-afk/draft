description: >
  Обработчик пишет запись в БД и публикует событие; исходный код теряет событие при падении
  после коммита. Выбрать вариант с transactional outbox. Проверка исполнением: модель БД с
  транзакциями и брокера, падение инъецируется в каждую точку, после перезапуска relay
  проверяется инвариант «нет потерь и нет событий о незакоммиченных записях».
