  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: выбор
    платформы с риском ухода поставщика оценивается ожидаемой ценой — эксплуатация за горизонт плюс вероятность
    хотя бы одного события за горизонт 1 − (1 − p)^H, умноженная на цену переезда. Верный вариант распределён поровну;
    ловушки — «дешевле в эксплуатации» (без риска), «минимальный риск» (свой слой совместимости) и «худший случай»
    (событие наверняка) — отличаются от ответа хотя бы в двух случаях (если верна сама ловушка — хотя бы в одном).
    Lead обычно сравнивает эксплуатацию или перестраховывается слоем совместимости; Principal оценивает опцион выхода
    в ожидании — граница Lead/Principal (θ ≈ 3,0); σ 0,3'
