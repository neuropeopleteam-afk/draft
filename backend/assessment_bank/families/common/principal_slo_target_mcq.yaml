  basis: "Априорная трудность (не по людям). Короткое расчётное задание у границы Lead/Principal: цель доступности выбирается по полной годовой цене — обеспечение, фактический простой (команда расходует лишь долю бюджета ошибок), простой последовательной внешней зависимости и договорный штраф по итоговой доступности. Верный уровень распределён поровну по четырём; ловушки — «максимальная цель», «самая дешёвая», расчёт без внешней зависимости и при полном расходе бюджета — отличаются от ответа хотя бы в двух случаях. Lead обычно берёт «как можно выше» или забывает, что простой зависимости съедает договорный запас, — граница Lead/Principal (θ ≈ 3,0); σ 0,3"
