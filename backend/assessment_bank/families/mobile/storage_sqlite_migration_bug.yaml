  basis: "Скрипт из 7–8 строк, один подтип дефекта (NOT NULL без DEFAULT при ALTER TABLE ADD COLUMN); рядом — верные строки той же формы с DEFAULT и обнуляемый столбец, так что нужно знать правило, а не искать «странную» строку; симптом «только при обновлении» указывает на миграцию, но не на строку. Стажёр/Junior, у порога Junior (b ≈ −1,2)"
