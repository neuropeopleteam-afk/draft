description: >
  Скрипт миграции локальной базы приложения добавляет столбцы; один объявлен NOT NULL без значения по
  умолчанию, и миграция падает у обновивших приложение. Ключ: показанный скрипт исполняется в sqlite3 на
  базе старой версии с данными — дефектный падает, исправленный проходит.
