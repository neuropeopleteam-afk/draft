description: >
  Несколько параллельных запросов получают 401 и каждый обновляет токены; сервер с ротацией отзывает сессию при
  повторном refresh-токене. Ключ: модель сервера в Node, две волны параллельных запросов; верен только
  single-flight со сбросом промиса и повтором с новым токеном.
