  basis: 'Априорная, до калибровки на людях (a = 1,0). Нужно для каждого из четырёх сегментов оценить неопределённость
    доли сбоев (интервал, а не точечная оценка), сравнить обе границы с порогом допустимого, а не с долей прежней
    версии, и принимать решение по сегментам, а не по сумме, где плохой сегмент прячется за хорошими. Числа подобраны
    так, что решение не зависит от метода интервала и z (1,645 или 1,96). Дистракторы — три типичные ошибки управления
    выкаткой; Lead обычно избегает одной-двух, Principal — всех трёх: у порога Lead/Principal'
