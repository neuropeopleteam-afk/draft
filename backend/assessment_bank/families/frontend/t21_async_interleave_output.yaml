description: 'Набор t21 (короткие практические у порогов, 21.10). Два-три вызова одной async-функции загрузки
  запускаются без await; каждая в цикле печатает шаг и делает await, на промис одного вызова повешен .then, в части
  вариантов есть setTimeout(…, 0) и синхронный console.log между вызовами; предсказать порядок вывода. Ключ — модель
  очереди микрозадач в генераторе, проверка — исполнение показанного кода в Node.js.'
