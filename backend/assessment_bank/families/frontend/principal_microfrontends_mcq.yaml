  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: организация
    фронтенда нескольких команд выбирается по сумме цены ожидания изменений (среднее ожидание релизного поезда —
    половина интервала), платформенной доплаты и потери выручки от LCP (дублирующиеся зависимости микрофронтендов,
    полные перезагрузки между отдельными приложениями). Верный вариант распределён поровну; ловушки — «максимальная
    независимость», «без доплаты», расчёт без цены LCP — отличаются от ответа хотя бы в двух случаях (если верна
    сама ловушка — хотя бы в одном). Lead обычно выбирает микрофронтенды «ради независимости команд»; Principal
    переводит ожидание и скорость страниц в деньги — граница Lead/Principal (θ ≈ 3,0); σ 0,3'
