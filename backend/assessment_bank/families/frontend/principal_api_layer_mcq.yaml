  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: схема
    получения данных страницы выбирается по годовой цене — доплата за слой плюс потеря выручки от задержки цепочки
    зависимых запросов (кто делает каждый круг — клиент по своей сети или сервер внутри дата-центра), усреднённой
    по долям мобильной и проводной сети. Верный вариант распределён поровну; ловушки — «меньше всего кругов клиента»,
    «без нового слоя» и расчёт по проводной сети — отличаются от ответа хотя бы в двух случаях (если верна сама
    ловушка — хотя бы в одном). Lead обычно выбирает по моде (GraphQL, сборка на сервере) или по простоте; Principal
    считает цепочку по сетям — граница Lead/Principal (θ ≈ 3,0); σ 0,3'
