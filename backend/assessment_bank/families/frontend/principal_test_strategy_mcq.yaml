  basis: "Априорная трудность (не по людям). Короткое расчётное задание у границы Lead/Principal: стратегия тестов фронтенда выбирается по годовой цене — сопровождение, разбор нестабильных падений сквозных тестов и ушедшие дефекты каждого вида с их ценой (а не их число). Верная стратегия распределена поровну; ловушки — «ловит больше всего дефектов», «дешевле всего в сопровождении» и расчёт без разбора нестабильных падений — отличаются от ответа хотя бы в двух случаях (если верна сама ловушка — хотя бы в одном). Lead обычно выбирает по пирамиде тестов или по числу пойманных дефектов; Principal взвешивает дефекты ценой — граница Lead/Principal (θ ≈ 2,9); σ 0,3"
