description: 'Функция экранирования и шаблон HTML для пользовательского контента. По полезной нагрузке из отчёта
  о безопасности найти строку с ошибкой. Ключ: дефектный код даёт HTML, отличный от эталона, на наборе вредоносных
  входов, исправление совпадает с эталоном. Версия 2: только подтипы «неэкранированное поле» и «атрибут без кавычек»;
  подтипы «replace без /g» для < и для " — семейство frontend.sec.replace_global_bug.'
