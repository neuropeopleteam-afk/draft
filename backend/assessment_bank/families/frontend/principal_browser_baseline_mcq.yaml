  basis: "Априорная трудность (не по людям). Короткое расчётное задание у границы Lead/Principal: политика поддержки браузеров выбирается по сумме цены тестирования и сборки, ушедшей выручки неподдержанных групп (только часть пользователей уходит) и потери выручки от добавки к LCP у тех групп, кому достаётся лишний вес. Верная политика распределена поровну; ловушки — «максимальный охват», «самый лёгкий бандл» и расчёт без цены тестирования — отличаются от ответа хотя бы в двух случаях (если верна сама ловушка — хотя бы в одном). Lead обычно решает по доле старых браузеров «меньше процента — отключаем» или «поддерживаем всех»; Principal сравнивает полные цены, включая двойную сборку, — граница Lead/Principal (θ ≈ 2,9); σ 0,3"
