description: 'Набор t21 (короткие практические у порогов, 21.10). Интерфейс копит события аналитики в буфере: track
  отправляет пакет сразу при достижении порога размера, иначе заводит таймер setTimeout(…, 0); flush снимает таймер и
  печатает пакет. События приходят синхронно, из Promise.then / queueMicrotask и из таймеров; предсказать вывод.
  Каркас отличается от пакетной перерисовки через флаг и queueMicrotask (mobile.state.t21_render_batch_output). Ключ —
  модель очередей и таймеров в генераторе, проверка — исполнение показанного кода в Node.js.'
