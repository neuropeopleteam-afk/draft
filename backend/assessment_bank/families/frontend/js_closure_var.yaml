description: >
  Обработчики, созданные в цикле с var, видят итоговое значение счётчика. Кандидат
  указывает строку, которую достаточно исправить: объявление цикла (var → let) или
  строку замыкания (зафиксировать i). Обе строки засчитываются (accept), каждая
  подтверждена исполнением однострочного исправления (калибровка 05.10: строку
  замыкания выбирали 89 % ответов моделей ≥ 7B).
