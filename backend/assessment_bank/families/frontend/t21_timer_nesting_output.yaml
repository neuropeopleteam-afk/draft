description: 'Набор t21 (короткие практические у порогов, 21.10). Функция опроса увеличивает счётчик, печатает шаг,
  ставит микрозадачу проверки и перепланирует себя через setTimeout(…, 0), пока счётчик меньше N; рядом — разовые
  таймеры, синхронный лог и then, который ставит ещё один таймер; предсказать порядок вывода. Каркас отличается от
  плоской последовательности запуска (mobile.startup.t21_startup_order_output). Ключ — модель очередей микро- и
  макрозадач в генераторе, проверка — исполнение показанного кода в Node.js.'
