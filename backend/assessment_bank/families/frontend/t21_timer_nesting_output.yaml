  basis: 'Априорная, до калибровки на людях (a = 1,3 — практическое без вариантов ответа). Проследить очередь
    таймеров, которую меняет сам опрос: setTimeout(poll, 0) из колбэка ставит следующий шаг в конец очереди — после
    разовых таймеров и таймера, поставленного из then; микрозадача проверки выполняется сразу после своего шага, до
    следующего таймера; при прямом вызове poll() первый шаг синхронный, а его проверка — после всего синхронного кода.
    Вложенное планирование макро- и микрозадач — глубокая семантика цикла событий, уровень Senior. Набор t21 (21.10)
    у порога Senior (b = 1,1)'
