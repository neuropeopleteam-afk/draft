  basis: "Априорная трудность (не по людям). Короткое расчётное задание у границы Lead/Principal: политика хранения журналов по доле расследуемых вторжений. Нужен квантиль экспоненциального распределения времени обнаружения плюс задержка начала расследования. Senior и Lead обычно берут «среднее + задержка» или забывают задержку; Principal считает по хвосту. Ловушки с обеих сторон от ключа"
