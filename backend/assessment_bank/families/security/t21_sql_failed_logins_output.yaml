description: 'Набор t21 (короткие практические у порогов, 21.10). Журнал входов (онлайн-банк, VPN, админка, SSH,
  почта) и запрос SELECT … WHERE ok = 0 AND ts >= ''<граница>'' ORDER BY ts DESC LIMIT n; предсказать строки
  результата. Ключ — независимая модель (сравнение времени и сортировка в генераторе), проверка — исполнение
  показанного запроса в песочнице sqlite.'
