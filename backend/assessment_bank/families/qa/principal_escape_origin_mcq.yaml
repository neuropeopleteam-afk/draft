  basis: 'Априорная, до калибровки на людях (a = 1,0). Короткое расчётное задание у границы Lead/Principal: нужно
    разложить утечку дефектов по источникам и увидеть, что вложение в ранний этап не действует на дефекты, появляющиеся
    позже (конфигурация, внешние интеграции). Senior считает «все проходят все этапы», Lead обычно перемножает этапы
    верно, но относит усиленный этап ко всем источникам; Principal держит модель по источникам. Ловушки с обеих
    сторон от ключа, место ключа по величине равновероятно'
