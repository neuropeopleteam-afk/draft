  basis: "Версия 2: выбор метода, а не числа — нужно знать, что перцентили не усредняются (даже взвешенно) и перцентиль общей выборки берётся из суммарной гистограммы; дашборд в условии подсказывает неверный метод; таблица — иллюстрация (маленький медленный узел). По панели 06.10 числовая версия имела b ≈ 1,9–2,5 (Middle/Senior)"
