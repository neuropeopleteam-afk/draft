description: >
  По гистограммам времени ответа нескольких узлов выбрать способ получить p95/p99 по всем
  запросам сервиса: сложить гистограммы и интерполировать внутри интервала. Дистракторы —
  способы усреднения перцентилей узлов. Ключ проверяется исполнением: только метод ключа даёт
  перцентиль общей выборки по показанной таблице.
