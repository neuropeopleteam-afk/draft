description: 'Набор t21 (короткие практические у порогов, 21.10). Журнал из 5–6 событий около полуночи: отметки
  клиента по Москве (timezone(timedelta(hours=3))) и сервера по UTC; каждое событие переводится astimezone в UTC и в
  МСК, печатается число событий по датам (ММ-ДД) для обоих способов. Ключ — независимая модель сдвига на ±3 часа в
  генераторе, проверка — исполнение показанного кода в песочнице Python.'
