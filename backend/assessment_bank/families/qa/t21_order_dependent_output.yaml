description: 'Набор t21 (короткие практические у порогов, 21.10). Модуль держит кэш-словарь и журнал походов в базу;
  загрузчик кэширует ответ по ключу без второго параметра (валюта, язык, город, тариф, окружение) или по полной паре;
  два теста проверяют значение и/или число походов; прогон в порядке A→B и B→A в одном процессе со сбросом кэша,
  кэша и журнала или без сброса; печать — результаты тестов в порядке запуска и размер кэша. Ключ — независимая
  модель кэша в генераторе, проверка — исполнение показанного кода в песочнице Python.'
