description: 'Набор t21 (короткие практические у порогов, 21.10). Декоратор retry оборачивает проверку-предикат и
  перебирает записанные ответы сервиса: assert на каждой попытке, except только AssertionError, finally печатает
  номер попытки из журнала в замыкании; две проверки — одна падает с ValueError на нечисловом ответе, другая
  проходит после повторов или исчерпывает ответы. Ключ — независимая модель попыток в генераторе, проверка —
  исполнение показанного кода в песочнице Python.'
