description: 'Набор t21 (короткие практические у порогов, 21.10). Модули показаны объектами SimpleNamespace:
  источник держит функцию-зависимость, потребитель взял ссылку на неё при «импорте», вторая функция обращается через
  источник; тест по очереди подменяет атрибут источника и потребителя через mock.patch.object (или создаёт
  потребителя внутри подмены) и печатает результаты обеих функций до, внутри и после каждой подмены. Ключ —
  независимая модель привязок в генераторе, проверка — исполнение показанного кода в песочнице Python.'
