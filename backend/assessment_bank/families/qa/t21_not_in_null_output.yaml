description: 'Набор t21 (короткие практические у порогов, 21.10). Две выгрузки (обе таблицы показаны в условии, NULL
  в ключах с одной или обеих сторон); запрос из трёх строк UNION ALL: COUNT(*) и COUNT(key) по каждой выгрузке и
  число ключей первой, не найденных во второй, через NOT IN и NOT EXISTS. Отличие от analyst/data_eng
  t21_not_in_null_output — сводка сверки с COUNT(*) / COUNT(col) и NULL с обеих сторон. Ключ — независимая
  трёхзначная логика в генераторе, проверка — исполнение запроса в sqlite.'
