  basis: 'Априорная, до калибровки на людях (a = 1,3 — практическое без вариантов ответа). Проследить трёхзначную
    логику: COUNT(key) не считает NULL, key NOT IN (подзапрос) при NULL в подзапросе ни для одной строки не TRUE, а
    NULL-ключ первой выгрузки не проходит NOT IN и без этого; NOT EXISTS с равенством считает строки без пары,
