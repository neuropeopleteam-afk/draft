  basis: 'Априорная, до калибровки на людях (a = 1,3). Скрипт из двух операторов (UPDATE закрывает изменившиеся
    текущие версии, INSERT добавляет новые) находит изменившиеся ключи по отметке «закрыто сегодня», поэтому повторный
    запуск за ту же дату вставляет вторую текущую версию. Верно — вставлять, если у ключа нет текущей версии; дистракторы
    фиксированного состава: DISTINCT, INSERT OR IGNORE без уникального ключа, условие valid_from в UPDATE. Нужно
    проследить повторный запуск. Граница Middle/Senior'
