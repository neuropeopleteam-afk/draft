  basis: "Априорная трудность (не по людям). Решение на горизонте: стоимость политики уровней хранения складывается из хранения по возрасту данных и платы за чтение и извлечение, которая зависит от того, как чтения убывают с возрастом; объём и чтения растут. Четыре политики по схеме 2×2 (два порога горячего уровня × два порога архива), верная меняется между вариантами, ловушки — минимум по одному хранению и минимум без роста. Lead обычно оптимизирует только хранение («всё старое — в архив») или считает по первому месяцу — граница Lead/Principal (θ ≈ 2,75). σ 0,3"
