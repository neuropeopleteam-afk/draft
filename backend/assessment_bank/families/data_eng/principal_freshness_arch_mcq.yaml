  basis: 'Априорная, до калибровки на людях (a = 1,0). Выбор архитектуры по требованию свежести и полной цене: худшая
    задержка пакета (интервал + обработка), цена месяца = число запусков × (накладные + объём интервала и окна досчёта
    поздних событий) против постоянного кластера потока. Ключевое наблюдение — при длинном окне досчёта частые микропакеты
    пересчитывают одни и те же часы много раз и дороже потока. Ответ равновероятен среди четырёх архитектур; ловушки
    — самая свежая, самая дешёвая без требования, без окна досчёта, без накладных — отличаются от ответа минимум
    в двух случаях (у крайних — в одном). Lead обычно выбирает «поток, раз нужна свежесть» или микропакеты без учёта
    окна досчёта — граница Lead/Principal (θ ≈ 2,5). Короткое задание (≤ 7 мин). σ 0,3'
