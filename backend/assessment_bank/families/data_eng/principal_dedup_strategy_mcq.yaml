  basis: 'Априорная, до калибровки на людях (a = 1,0). Решение о семантике доставки по полной цене: транзакции потоковой
    платформы дают exactly-once только внутри неё (во внешней БД дубли остаются), окно дедупликации не ловит повторы
    старше окна, идемпотентная запись убирает дубли ценой более медленной записи, а иногда дешевле всего оставить
    дубли и разбирать их. Ответ равновероятен среди четырёх; ловушки — «exactly-once закрывает всё», «окно ловит
    все повторы», самая дешёвая мера, «ноль дублей любой ценой» — отличаются от ответа минимум в двух случаях (у
    крайних — в одном). Lead обычно включает транзакции платформы «для exactly-once», не проверяя, где приёмник,
    — граница Lead/Principal (θ ≈ 2,4). Короткое задание (≤ 7 мин). σ 0,3'
