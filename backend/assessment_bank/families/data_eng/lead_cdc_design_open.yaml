  basis: 'Априорная, до калибровки на людях (a = 1,3). Поток изменений целиком: чтение журнала логической репликацией,
    согласованный снимок с позицией журнала и переход на поток без окна потерь (время снимка по числам варианта),
    поток в МБ/с и число партиций с запасом, ключ партиционирования по строке, идемпотентное применение MERGE с
    номером позиции и удаления, особенность (несовместимое изменение схемы, рост удерживаемого WAL при простое потребителя,
    горячий ключ) и сверка. Senior обычно называет «Debezium + Kafka + upsert» без перехода со снимка, порядка и
    расчёта — граница Senior/Lead (θ ≈ 2,0); рубрика 0–4 по пяти критериям, σ 0,3'
