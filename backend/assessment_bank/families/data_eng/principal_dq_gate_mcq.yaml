  basis: "Априорная трудность (не по людям). Политика качества данных как решение по риску: полнота и ложные срабатывания двух проверок, цена остановки, карантина и оповещения, остаточный ущерб после оповещения и то, что карантин раздела не локализует сквозной критический дефект; ожидаемая цена по сценариям дня. Ответ равновероятен среди четырёх политик; ловушки — самая строгая, самая мягкая, без ложных срабатываний, «оповещение устраняет ущерб» — отличаются от ответа минимум в двух случаях (у крайних — в одном). Lead обычно выбирает «блокировать всё, что упало» или карантин по умолчанию, не взвешивая ложные срабатывания и сквозные дефекты, — граница Lead/Principal (θ ≈ 2,6). Короткое задание (≤ 7 мин). σ 0,35"
