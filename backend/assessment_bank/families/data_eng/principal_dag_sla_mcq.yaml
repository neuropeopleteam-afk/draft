  basis: 'Априорная, до калибровки на людях (a = 1,0). Решение по надёжности цепочки данных: время готовности витрины
    в каждом сценарии задержки источника через граф зависимостей (последовательные A и B против параллельных, ускорение
    одного шага, общий множитель кластера, сдвиг источника), доля дней вовремя против цели и выбор самой дешёвой
    достаточной меры. Ответ равновероятен среди четырёх мер; ловушки — самая дешёвая мера, наибольший прирост, расчёт
    по средней задержке — отличаются от ответа минимум в двух случаях. Lead обычно берёт «кластер мощнее» или считает
    по средней задержке, не по распределению, — граница Lead/Principal (θ ≈ 3,0 по шкале продукта; b 2,9 — по 2–3
    взаимодействующим ограничениям, Я25 v4). Короткое задание (≤ 7 мин). σ 0,3'
