  basis: "Априорная трудность (не по людям). Стратегия на год: масштаб по числам варианта (наборы без владельца, инциденты из-за источников, наборы с персональными данными) и приоритет критичных, федеративное владение при малой центральной команде, каталог с происхождением, контракты данных на границе источника с проверкой в его CI, SLA качества только для критичных, классификация и доступ к персональным данным, особенность (проверка регулятора, слияние с другой компанией, самообслуживание аналитики) и метрики без бюрократии. Lead обычно предлагает «каталог и проверки качества» без модели владения, контрактов на источниках и приоритетов — граница Lead/Principal (θ ≈ 2,75); рубрика 0–4 по шести критериям, σ 0,3"
