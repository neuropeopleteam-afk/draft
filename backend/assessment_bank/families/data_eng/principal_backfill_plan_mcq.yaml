    среди четырёх планов; ловушки — самый дешёвый, самый быстрый, без запрета ночного окна, без цены замедления
    — отличаются от ответа минимум в двух случаях. Lead обычно берёт временный кластер «чтобы точно успеть» или
    считает свободные часы вместе с ночным окном — граница Lead/Principal (θ ≈ 3,0 по шкале продукта; b 3,0 — по
    2–3 взаимодействующим ограничениям, Я25 v4). Короткое задание (≤ 7 мин). σ 0,3'
