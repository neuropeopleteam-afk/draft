  basis: 'Априорная, до калибровки на людях (a = 1,0). Архитектурное решение по надёжности: минуты простоя в год
    по каждой топологии (отказы региона × min(длительность, RTO) плюс собственный простой) против допуска SLO, цена
    синхронной записи между регионами в p99 и цена топологий не по возрастанию надёжности (тёплый резерв держит
    простаивающую мощность). Ответ равновероятен среди четырёх; ловушки — самая дешёвая, самая доступная, без бюджета
    задержки, «переключение мгновенное» — отличаются от ответа минимум в двух случаях. Lead обычно выбирает активный–активный
    «для надёжности» или тёплый резерв по привычке, не считая минуты простоя, — граница Lead/Principal (θ ≈ 3,0
    по шкале продукта; b 3,0 — по 2–3 взаимодействующим ограничениям, Я25 v4). Короткое задание (≤ 7 мин). σ 0,3'
