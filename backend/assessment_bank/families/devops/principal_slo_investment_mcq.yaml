  basis: "Априорная трудность (не по людям). Решение по бюджету надёжности: доступность пути из последовательных звеньев и резервированных групп, эффект каждой меры (резерв с неидеальным переключением, кэш-фолбэк с долей попаданий, ещё один экземпляр), сравнение с целью SLO и выбор самой дешёвой достаточной меры. Ответ равновероятен среди четырёх мер; приближение «недоступности складываются» даёт тот же ответ; ловушки — самая дешёвая мера, «самое слабое звено», наибольший прирост, расчёт без неудачного переключения — отличаются от ответа минимум в двух случаях. Lead обычно усиливает самое слабое звено или берёт меру с наибольшим приростом, не сравнивая цену достаточных мер, — граница Lead/Principal (θ ≈ 2,5). Короткое задание (≤ 7 мин). σ 0,3"
