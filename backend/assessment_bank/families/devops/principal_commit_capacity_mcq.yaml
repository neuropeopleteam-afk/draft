target_grades: [principal]
format: mcq_concept
language: text
invariants:
  n_options: 4
  extra:
    distractors: "три из шести: peak_now, peak_year, avg_now, no_growth, base_only, inverted (больше ключа 0, 1 или 2 равновероятно)"
