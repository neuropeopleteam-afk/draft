# b — априорная оценка по числу взаимодействующих ограничений, не калибровка; калибровка — после пилота.
prior_difficulty:
  b: 3.0
  a: 1.3
  sigma_variant: 0.35
  basis: "Априорная трудность (не по людям). Решение о закупке мощности на год: предельный анализ («газетчик») — каждая следующая зарезервированная ВМ оправдана, пока занята больше чем 1 − скидка часов года; профиль нагрузки — по кварталам с ростом, поэтому ответ — уровень будущих кварталов, а не текущий. Дистракторы — три из шести типичных решений одной формы (текущий пик, пик через год, средняя, оптимум без роста, только база, перевёрнутое правило), завышающие и занижающие; место ключа по величине меняется. Lead обычно резервирует среднюю или базовую нагрузку по текущему профилю — граница Lead/Principal (θ ≈ 3,0 по шкале продукта; b 3,0 — по 2–3 взаимодействующим ограничениям, Я25 v4). Короткое задание (≤ 7 мин). σ 0,35"
