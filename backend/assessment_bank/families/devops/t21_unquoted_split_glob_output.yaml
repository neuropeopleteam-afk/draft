  basis: 'Априорная, до калибровки на людях (a = 1,3 — практическое без вариантов ответа). Проследить, что $VAR без
    кавычек проходит подстановку имён файлов (шаблон раскрывается в файлы каталога по алфавиту), а "$VAR" остаётся
    одним словом, и что кавычки внутри значения переменной — обычные символы при разбиении set -- $FLAGS. Кавычки и
