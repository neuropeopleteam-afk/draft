description: 'Набор t21 (короткие практические у порогов, 21.10). Скрипт очистки берёт шаблон файлов и строку флагов
  из переменных, перебирает файлы с кавычками и без и раскладывает флаги в позиционные параметры; состав каталога
  дан в условии. Ключ — независимая модель раскрытия в генераторе, проверка — исполнение показанного скрипта в bash
  с теми же файлами.'
