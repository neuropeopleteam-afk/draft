  basis: 'Априорная, до калибровки на людях (a = 1,0). Организация дежурств в инженерных терминах: две нормы (ночные
    вызовы дежурной недели и часы разбора в месяц на инженера) и четыре меры с разным действием — люди в ротации
    снижают часы на человека, но не ночные вызовы недели; чистка шума и авторемонт уменьшают поток; второй часовой
    пояс снимает ночь. Ответ равновероятен среди четырёх мер; ловушки — самая дешёвая, «добавить людей», наибольшее
    сокращение вызовов, без нормы ночных — отличаются от ответа минимум в двух случаях. Lead обычно добавляет людей
    в ротацию или чистит шум «по умолчанию», не проверяя обе нормы, — граница Lead/Principal (θ ≈ 3,0 по шкале продукта;
    b 2,9 — по 2–3 взаимодействующим ограничениям, Я25 v4). Короткое задание (≤ 7 мин). σ 0,3'
