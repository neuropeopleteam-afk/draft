  basis: 'Априорная, до калибровки на людях (a = 1,3 — практическое без вариантов ответа). Проследить 6–8 раскрытий
    по порядку: «:-» подставляет значение и для пустой, и для неустановленной переменной, но не присваивает; «-» без
    двоеточия не срабатывает для пустой строки; «:=» (и : "${V:=d}") присваивает, и следующие раскрытия видят новое
    значение. Одна неочевидная семантика раскрытия параметров bash — уровень Middle. Набор t21 (21.10) у порога
    Middle (b = 0,0)'
