description: 'Набор t21 (короткие практические у порогов, 21.10). Скрипт выкладки читает три настройки (пустую,
  снятую через unset и заданную) и печатает их раскрытия с значениями по умолчанию в квадратных скобках, чтобы
  пустая строка была видна; предсказать вывод echo. Ключ — независимая модель состояния переменных в генераторе,
  проверка — исполнение показанного скрипта в bash-песочнице.'
