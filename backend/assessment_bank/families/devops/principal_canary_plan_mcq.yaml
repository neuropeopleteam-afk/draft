  basis: "Априорная трудность (не по людям). Политика выкатки как экономическое решение: допустимость плана (канарейка набирает нужное для обнаружения число запросов и идёт не меньше времени проявления медленных дефектов), затем ожидаемая цена релиза — ожидание конвейера у всех релизов плюс ошибки клиентов у доли плохих. Ответ равновероятен по месту доли среди четырёх; ловушки — наименьшая доля (меньше всего клиентов под риском), наименьшее время, выбор без цены ожидания и без цены ошибок — отличаются от ответа минимум в двух случаях, часть из них недопустима. Lead обычно выбирает «1 % на час» по привычке или минимизирует только риск для клиентов — граница Lead/Principal (θ ≈ 2,6). Короткое задание (≤ 7 мин). σ 0,35"
