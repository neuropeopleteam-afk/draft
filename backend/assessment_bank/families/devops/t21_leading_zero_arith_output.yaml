description: 'Набор t21 (короткие практические у порогов, 21.10). Скрипт извлекает номер с ведущими нулями из имени
  дампа, архива, сборки или из порядковой даты и считает по нему соседние номера в $(( )) с 10# и без, сравнивает
  порог через [ ] и (( )) и печатает имя следующего файла через printf; все числа без 10# — из цифр 0–7, ошибок
  основания в коде нет. Ключ — независимая модель в генераторе, проверка — исполнение показанного скрипта в
  bash-песочнице.'
