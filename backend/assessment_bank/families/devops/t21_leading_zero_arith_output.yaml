  basis: 'Априорная, до калибровки на людях (a = 1,3 — практическое без вариантов ответа). Проследить, что номер с
    ведущим нулём из имени файла или порядковой даты (0014, 045) в $(( )) и (( )) читается как восьмеричный,
    10#$n возвращает десятичное значение, а [ -lt ] сравнивает как десятичные числа; посчитать восьмеричное значение.
    Одна неочевидная семантика арифметики bash — уровень Middle. Набор t21 (21.10) у порога Middle (b = 0,1)'
