# b — априорная оценка по числу взаимодействующих ограничений, не калибровка; калибровка — после пилота.
prior_difficulty:
  b: 3.0
  a: 1.3
  sigma_variant: 0.3
  basis: "Априорная трудность (не по людям). План переезда базы: два разных допуска (полный простой и запрет записи), время копии на разных скоростях (без нагрузки и параллельно с трафиком), условие осуществимости репликации изменений (скорость применения потока выше скорости записи) и выбор самого дешёвого достаточного способа. Ответ равновероятен среди четырёх; ловушки — самый дешёвый, «без простоя», CDC без проверки скорости применения, без учёта запрета записи — отличаются от ответа минимум в двух случаях (у крайних — в одном). Lead обычно выбирает CDC «как правильно» или двойную запись, не проверяя осуществимость и допуски, — граница Lead/Principal (θ ≈ 3,0 по шкале продукта; b 3,0 — по 2–3 взаимодействующим ограничениям, Я25 v4). Короткое задание (≤ 7 мин). σ 0,3"
