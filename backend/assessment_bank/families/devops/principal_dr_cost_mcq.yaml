  basis: 'Априорная, до калибровки на людях (a = 1,0). Решение по риску: ожидаемая годовая цена = стоимость + вероятность
    события × (RTO × потери в час + RPO × цена минуты данных) при ограничении регулятора на RTO; верная стратегия
    меняется между вариантами (от резервных копий до активного-активного), а ловушки — «самая дешёвая», «самая надёжная»,
    выбор без ограничения регулятора и без цены потерянных данных — отличаются от ответа минимум в двух случаях.
    Lead обычно выбирает «тёплый резерв» по привычке или без взвешивания вероятностью — граница Lead/Principal (θ
    ≈ 2,75). σ 0,3'
