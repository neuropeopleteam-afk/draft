description: >
  Тест сравнивает HTML виджета целиком и ломается при рефакторинге вёрстки. Нужно выбрать
  проверку видимого текста, которая переживёт смену разметки и поймает ошибку расчёта.
  Каждый вариант исполняется в node на текущей и новой вёрстке и на мутанте.
