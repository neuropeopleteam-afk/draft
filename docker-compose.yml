# Стек: db (PostgreSQL 16) + api (FastAPI) + web (nginx со сборкой React).
# Порты публикуются только на 127.0.0.1; наружу сайт отдаёт nginx хоста.
# Бюджет памяти стека ≤ 1,5 ГБ (db 512M + api 896M + web 96M = 1504M; NER Natasha ~100 МБ на воркер).
name: spectrek_fsp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "work_mem=8MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      # Ключи Yandex Cloud Postbox; пока файла нет — DEV_MODE (код подтверждения в логе и в ответе API)
      - path: ${POSTBOX_ENV_FILE:-./secrets/postbox.env}
        required: false
      # LLM (Yandex AI Studio или любой OpenAI-совместимый): LLM_BASE_URL, LLM_API_KEY, LLM_FOLDER_ID, LLM_MODEL,
      # LLM_PROVIDER. Нет файла — всё работает на детерминированных правилах без LLM.
      - path: ${LLM_ENV_FILE:-./secrets/llm.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fsp}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8141}:8000"
    mem_limit: 896m

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8140}:80"
    mem_limit: 96m

  # ФСП ID на базе Keycloak — для проверки OIDC-совместимости. Выключен по умолчанию:
  #   docker compose --profile keycloak up -d keycloak
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8142}:8080"
    mem_limit: 768m

volumes:
  db_data:
