# Стек: db (PostgreSQL 16) + api (FastAPI) + web (nginx со сборкой React).
# Порты публикуются только на 127.0.0.1; наружу сайт отдаёт nginx хоста.
# Память (бюджет стека ≤ 2,5 ГБ): db 320M + api 1536M + web 32M + keycloak 576M = 2464M; без профиля fsp-id — 1888M.
# Сервер — 7,9 ГБ, на 08.10 свободно 5,5 ГБ: лимит api 1536M — запас на день оценки, когда несколько экспертов жюри разом создают
# песочницы (подборка по 500 кандидатам, разбор потребности) и api поднялся с 342 до 593 МиБ из 768 (77 %) за 100 минут проверки.
# Лимиты — по фактическому потреблению на стенде (cgroup memory.peak и memory.events с запуска контейнера):
#   api 07.10: лимит 640 МБ достигнут — memory.peak = 640 МБ, memory.events max 33, oom_kill 1 (13:18 МСК воркер
#     uvicorn убит сразу после входа эксперта жюри с созданием песочницы и разбора потребности через LLM; uvicorn
#     поднял новый воркер за 5 с, контейнер не перезапускался). Обычное потребление — 457–508 МБ: 2 воркера по
#     250–320 МБ (NER Natasha ~100 МБ, банк заданий, модели подбора, кэши) + мастер 29 МБ + resource_tracker 17 МБ.
#     Сверху — всплески: создание песочницы жюри, разбор PDF в отдельном процессе (предел 256 МБ, один на воркер),
#     симуляция «Красной кнопки» вне кэша ~140 МБ. 768 МБ = обычное 508 + всплеск ~260 МБ (на 08.10 этого уже мало: 593 из 768 в спокойную проверку; локальный прогон 10 циклов
#     «песочница + потребность + подборка + гость QR + удаление» рост после прогрева не показал: ~332 МБ на процесс, +0,1 МБ за цикл,
#     рост на стенде — прогрев кэшей двух воркеров и всплески, не утечка песочниц); 06.10 пик был 351 МБ —
#     рост из-за функций 06.10 (живая демонстрация, кубки, кабинет ФСП) и лимита песочниц 60 (И10 п. 1);
#   db пик 109 МБ (shared_buffers 128 МБ + до ~36 соединений); web 6 МБ; keycloak пик 361 МБ (куча ≤ 45 % лимита ≈ 259 МБ).
# Нагрузочный тест — docs/LOAD_TEST.md. Keycloak включается COMPOSE_PROFILES=fsp-id.
name: spectrek_fsp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "work_mem=8MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
      # Отдельная база keycloak для ФСП ID (только при создании тома)
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # по TCP, а не через сокет: при первом запуске init-скрипты идут на временном сервере без TCP, и проверка
      # через сокет отвечала «готов» до его перезапуска — api ловил «connection refused» на миграциях
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      # Ключи Yandex Cloud Postbox; пока файла нет — DEV_MODE (код подтверждения в логе и в ответе API)
      - path: ${POSTBOX_ENV_FILE:-./secrets/postbox.env}
        required: false
      # LLM (Yandex AI Studio или любой OpenAI-совместимый): LLM_BASE_URL, LLM_API_KEY, LLM_FOLDER_ID, LLM_MODEL,
      # LLM_PROVIDER. Нет файла — всё работает на детерминированных правилах без LLM.
      - path: ${LLM_ENV_FILE:-./secrets/llm.env}
        required: false
      # Цепочка LLM (docs/LLM.md): OPENROUTER_API_KEY, OPENROUTER_BASE_URL — основная модель через OpenRouter;
      # LLM_RELAY_URL, LLM_RELAY_TOKEN — ретранслятор (с сервера в РФ OpenRouter отвечает 403). Порядок —
      # LLM_CHAIN в .env (например openrouter,yandex). Нет файлов или LLM_CHAIN — один провайдер из llm.env.
      - path: ${OPENROUTER_ENV_FILE:-./secrets/openrouter.env}
        required: false
      - path: ${LLM_RELAY_ENV_FILE:-./secrets/llm_relay.env}
        required: false
      # Открытая модель на этой машине (профиль llm-local ниже, docs/LLM.md, раздел 9): LLM_CHAIN=local и тайм-ауты CPU.
      # Подключается командой make llm-local (LLM_LOCAL_ENV_FILE=./infra/llm-local/llm-local.env); без неё файла нет —
      # ничего не меняется.
      - path: ${LLM_LOCAL_ENV_FILE:-./secrets/llm_local.env}
        required: false
      # Web Push: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT. Нет файла — push выключен, остальное работает.
      - path: ${VAPID_ENV_FILE:-./secrets/vapid.env}
        required: false
      # ФСП ID: FSP_OIDC_CLIENT_SECRET, FSP_DEMO_PASSWORD (тот же файл читает Keycloak при импорте realm)
      - path: ${FSP_ID_ENV_FILE:-./secrets/fsp_id.env}
        required: false
      # ATS: TALANTIX_TOKENS_JSON (или TALANTIX_ACCESS_TOKEN + TALANTIX_REFRESH_TOKEN), TALANTIX_VACANCY_ID, POTOK_TOKEN,
      # POTOK_VACANCY_ID, HUNTFLOW_TOKEN, HUNTFLOW_ACCOUNT_ID, HUNTFLOW_VACANCY_ID, ATS_USER_AGENT_CONTACT.
      # Импорт в компанию: python -m app.integrations.ats.cli import-env --employer-email ... (см. docs/ATS.md)
      - path: ${ATS_ENV_FILE:-./secrets/ats.env}
        required: false
      # Паспорт грейда: PASSPORT_SIGNING_KEY — ключ подписи Ed25519 (python tools/passport/genkey.py > secrets/passport.env,
      # chmod 600). Нет файла — эфемерный «тестовый ключ» процесса, страница проверки /verify/<id> так и пишет.
      - path: ${PASSPORT_ENV_FILE:-./secrets/passport.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fsp}
      # Пусто — кнопка «Войти через ФСП ID» скрыта. Прод: https://fsp.neuropeople.pro/auth/realms/fsp
      FSP_OIDC_ISSUER: ${FSP_OIDC_ISSUER:-}
      FSP_OIDC_INTERNAL_BASE: ${FSP_OIDC_INTERNAL_BASE:-http://keycloak:8080/auth/realms/fsp}
      # Демо-ATS (заглушки Talantix, «Поток», Хантфлоу, вебхук) api вызывает сам у себя — напрямую, без адреса сайта
      # (localhost:8140 изнутри контейнера недоступен). В настройках компании и в интерфейсе — публичный адрес.
      ATS_STUB_BASE_URL: ${ATS_STUB_BASE_URL:-http://127.0.0.1:8000}
      # Адрес и имя модели сервиса llm-local; провайдер local используется, только если он есть в LLM_CHAIN
      LLM_LOCAL_BASE_URL: ${LLM_LOCAL_BASE_URL:-http://llm-local:8080/v1}
      LLM_LOCAL_MODEL: ${LLM_LOCAL_MODEL:-qwen3.5-9b}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8141}:8000"
    mem_limit: 1536m  # 08.10: было 768m (77 % при спокойной проверке, OOM 07.10 при 640m); сервер 7,9 ГБ, свободно 5,5 ГБ

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8140}:80"
    mem_limit: 32m

  # ФСП ID (демо) — Keycloak, realm fsp (keycloak/realm-fsp.json), OIDC Authorization Code + PKCE.
  # За nginx по пути /auth (web → keycloak:8080), консоль администратора — только 127.0.0.1:${KEYCLOAK_PORT}.
  # Хранилище — наш PostgreSQL, отдельная база keycloak. Включение: COMPOSE_PROFILES=fsp-id в .env.
  keycloak:
    profiles: ["fsp-id"]
    build: ./keycloak
    restart: unless-stopped
    env_file:
      # KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD
      - path: ${KEYCLOAK_ENV_FILE:-./secrets/keycloak.env}
        required: false
      - path: ${FSP_ID_ENV_FILE:-./secrets/fsp_id.env}
        required: false
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-fsp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "6"
      KC_HOSTNAME: ${FSP_ID_PUBLIC_URL:-http://localhost:8140/auth}
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KEYCLOAK_PORT:-8142}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      PLATFORM_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8140}
      # Куча ≤ 45 % от 576M ≈ 259 МБ (как прежние 40 % от 640M), остальное — метаданные классов и потоки JVM
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=8 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20"
      JAVA_OPTS_APPEND: "-XX:TieredStopAtLevel=1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8142}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 576m

  # Открытая модель для машины без GPU и без доступа к зарубежным API (docs/LLM.md, раздел 9): llama.cpp server —
  # OpenAI-совместимый API на CPU, модель Qwen3.5-9B (Q4_K_M, 5,7 ГБ) скачивается с Hugging Face при первом старте в том
  # llm_models (в репозитории её нет). Включение одной командой: make llm-local. Без профиля llm-local сервис не
  # запускается и api работает как раньше. Рассуждения выключены (--reasoning off): на CPU они стоят минуты.
  # Замер 09.10 (8 vCPU, docs/llm/needs_cpu_qwen.json): память процесса 6,0–6,6 ГиБ (веса читаются в память целиком,
  # --load-mode none; кэш подсказок ограничен 512 МБ), разбор вакансии — медиана 29 с. Для машины 8 ГБ —
  # LLM_LOCAL_HF_REPO=unsloth/Qwen3.5-4B-GGUF:Q4_K_M, LLM_LOCAL_MODEL=qwen3.5-4b, LLM_LOCAL_MEM_LIMIT=4g (2,7 ГБ).
  # Потоков — по числу доступных ядер (nproc), а не всех ядер хоста: --threads -1 на 8 vCPU сервера проверок взял 192.
  llm-local:
    profiles: ["llm-local"]
    image: ${LLM_LOCAL_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b11515}
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
      LLM_THREADS: ${LLM_LOCAL_THREADS:-}
    entrypoint: ["/bin/sh", "-c", 'exec /app/llama-server --threads "$${LLM_THREADS:-$$(nproc)}" "$$@"', "llama-server"]
    command:
      - --hf-repo
      - ${LLM_LOCAL_HF_REPO:-unsloth/Qwen3.5-9B-GGUF:Q4_K_M}
      - --no-mmproj
      - --alias
      - ${LLM_LOCAL_MODEL:-qwen3.5-9b}
      - --ctx-size
      - ${LLM_LOCAL_CTX:-16384}
      - --parallel
      - ${LLM_LOCAL_PARALLEL:-2}
      - --cache-ram
      - ${LLM_LOCAL_CACHE_RAM:-512}
      - --load-mode
      - none
      - --reasoning
      - "off"
      - --no-webui
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - llm_models:/models
    ports:
      - "127.0.0.1:${LLM_LOCAL_PORT:-8143}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m  # первая загрузка модели
    mem_limit: ${LLM_LOCAL_MEM_LIMIT:-8g}

volumes:
  db_data:
  llm_models:
