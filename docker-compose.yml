# Стек: db (PostgreSQL 16) + api (FastAPI) + web (nginx со сборкой React).
# Порты публикуются только на 127.0.0.1; наружу сайт отдаёт nginx хоста.
# Память (бюджет стека ≤ 2 ГБ): db 320M + api 768M + web 32M + keycloak 576M = 1696M; без профиля fsp-id — 1120M.
# Лимиты — по фактическому потреблению на стенде (cgroup memory.peak и memory.events с запуска контейнера):
#   api 07.10: лимит 640 МБ достигнут — memory.peak = 640 МБ, memory.events max 33, oom_kill 1 (13:18 МСК воркер
#     uvicorn убит сразу после входа эксперта жюри с созданием песочницы и разбора потребности через LLM; uvicorn
#     поднял новый воркер за 5 с, контейнер не перезапускался). Обычное потребление — 457–508 МБ: 2 воркера по
#     250–320 МБ (NER Natasha ~100 МБ, банк заданий, модели подбора, кэши) + мастер 29 МБ + resource_tracker 17 МБ.
#     Сверху — всплески: создание песочницы жюри, разбор PDF в отдельном процессе (предел 256 МБ, один на воркер),
#     симуляция «Красной кнопки» вне кэша ~140 МБ. 768 МБ = обычное 508 + всплеск ~260 МБ; 06.10 пик был 351 МБ —
#     рост из-за функций 06.10 (живая демонстрация, кубки, кабинет ФСП);
#   db пик 109 МБ (shared_buffers 128 МБ + до ~36 соединений); web 6 МБ; keycloak пик 361 МБ (куча ≤ 45 % лимита ≈ 259 МБ).
# Нагрузочный тест — docs/LOAD_TEST.md. Keycloak включается COMPOSE_PROFILES=fsp-id.
name: spectrek_fsp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env (см. .env.example)}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "work_mem=8MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
      # Отдельная база keycloak для ФСП ID (только при создании тома)
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # по TCP, а не через сокет: при первом запуске init-скрипты идут на временном сервере без TCP, и проверка
      # через сокет отвечала «готов» до его перезапуска — api ловил «connection refused» на миграциях
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      # Ключи Yandex Cloud Postbox; пока файла нет — DEV_MODE (код подтверждения в логе и в ответе API)
      - path: ${POSTBOX_ENV_FILE:-./secrets/postbox.env}
        required: false
      # LLM (Yandex AI Studio или любой OpenAI-совместимый): LLM_BASE_URL, LLM_API_KEY, LLM_FOLDER_ID, LLM_MODEL,
      # LLM_PROVIDER. Нет файла — всё работает на детерминированных правилах без LLM.
      - path: ${LLM_ENV_FILE:-./secrets/llm.env}
        required: false
      # Web Push: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT. Нет файла — push выключен, остальное работает.
      - path: ${VAPID_ENV_FILE:-./secrets/vapid.env}
        required: false
      # ФСП ID: FSP_OIDC_CLIENT_SECRET, FSP_DEMO_PASSWORD (тот же файл читает Keycloak при импорте realm)
      - path: ${FSP_ID_ENV_FILE:-./secrets/fsp_id.env}
        required: false
      # ATS: TALANTIX_TOKENS_JSON (или TALANTIX_ACCESS_TOKEN + TALANTIX_REFRESH_TOKEN), TALANTIX_VACANCY_ID, POTOK_TOKEN,
      # POTOK_VACANCY_ID, HUNTFLOW_TOKEN, HUNTFLOW_ACCOUNT_ID, HUNTFLOW_VACANCY_ID, ATS_USER_AGENT_CONTACT.
      # Импорт в компанию: python -m app.integrations.ats.cli import-env --employer-email ... (см. docs/ATS.md)
      - path: ${ATS_ENV_FILE:-./secrets/ats.env}
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fsp}
      # Пусто — кнопка «Войти через ФСП ID» скрыта. Прод: https://fsp.neuropeople.pro/auth/realms/fsp
      FSP_OIDC_ISSUER: ${FSP_OIDC_ISSUER:-}
      FSP_OIDC_INTERNAL_BASE: ${FSP_OIDC_INTERNAL_BASE:-http://keycloak:8080/auth/realms/fsp}
      # Демо-ATS (заглушки Talantix, «Поток», Хантфлоу, вебхук) api вызывает сам у себя — напрямую, без адреса сайта
      # (localhost:8140 изнутри контейнера недоступен). В настройках компании и в интерфейсе — публичный адрес.
      ATS_STUB_BASE_URL: ${ATS_STUB_BASE_URL:-http://127.0.0.1:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8141}:8000"
    mem_limit: 768m

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8140}:80"
    mem_limit: 32m

  # ФСП ID (демо) — Keycloak, realm fsp (keycloak/realm-fsp.json), OIDC Authorization Code + PKCE.
  # За nginx по пути /auth (web → keycloak:8080), консоль администратора — только 127.0.0.1:${KEYCLOAK_PORT}.
  # Хранилище — наш PostgreSQL, отдельная база keycloak. Включение: COMPOSE_PROFILES=fsp-id в .env.
  keycloak:
    profiles: ["fsp-id"]
    build: ./keycloak
    restart: unless-stopped
    env_file:
      # KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD
      - path: ${KEYCLOAK_ENV_FILE:-./secrets/keycloak.env}
        required: false
      - path: ${FSP_ID_ENV_FILE:-./secrets/fsp_id.env}
        required: false
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-fsp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: "1"
      KC_DB_POOL_MIN_SIZE: "1"
      KC_DB_POOL_MAX_SIZE: "6"
      KC_HOSTNAME: ${FSP_ID_PUBLIC_URL:-http://localhost:8140/auth}
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KEYCLOAK_PORT:-8142}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      PLATFORM_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8140}
      # Куча ≤ 45 % от 576M ≈ 259 МБ (как прежние 40 % от 640M), остальное — метаданные классов и потоки JVM
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=45 -XX:InitialRAMPercentage=8 -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20"
      JAVA_OPTS_APPEND: "-XX:TieredStopAtLevel=1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8142}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 576m

volumes:
  db_data:
