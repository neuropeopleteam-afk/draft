# Непрерывная проверка: каждый push в main, каждый pull request и ручной запуск.
# Те же команды запускаются локально (см. docs/testing.md, раздел «Как запустить»).
#
#   lint            actionlint (+ shellcheck внутри run-блоков), shellcheck скриптов, docker compose config
#   backend-sqlite  pytest на SQLite: покрытие с порогом (fail_under в backend/pyproject.toml), JUnit, значки
#   backend-postgres те же тесты на PostgreSQL 16 (service-контейнер), миграции Alembic до head
#   bank            валидатор банка заданий: детерминизм, разнообразие, инварианты, ключи исполнением кода
#   frontend        npm ci, проверка типов (tsc), сборка Vite
#   e2e-local       сборка Docker-образов (api, web, keycloak), стек, демо-данные, дымовая проверка,
#                   сквозные сценарии Playwright против собранного стека (переиспользует e2e.yml)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Workflow, скрипты, compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck tools/ci/*.sh
      - name: docker compose config (основной стек и профиль fsp-id)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^JWT_SECRET=.*/JWT_SECRET=ci/' .env
          docker compose config -q
          docker compose --profile fsp-id config -q

  backend-sqlite:
    name: Бэкенд · SQLite · покрытие
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Шрифт DejaVu для PDF-отчётов
        run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest с покрытием (порог — fail_under в pyproject.toml)
        run: >-
          python -m pytest -p no:cacheprovider
          --cov=app --cov-report=term:skip-covered --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --junitxml=junit.xml
      - name: Сводка и значки
        if: ${{ !cancelled() && hashFiles('backend/coverage.xml') != '' }}
        run: >-
          python ../tools/ci/coverage_report.py --coverage coverage.xml --junit junit.xml --label SQLite
          --badge "$RUNNER_TEMP/badges/coverage.svg" --tests-badge "$RUNNER_TEMP/badges/tests.svg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: backend-sqlite-coverage
          path: |
            backend/coverage.xml
            backend/junit.xml
            backend/htmlcov
            ${{ runner.temp }}/badges
          retention-days: 14
          if-no-files-found: ignore

  backend-postgres:
    name: Бэкенд · PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsp -d fsp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://fsp:fsp@localhost:5432/fsp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Шрифт DejaVu для PDF-отчётов
        run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Миграции Alembic на чистой базе до head
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic current | grep '(head)'
          DATABASE_URL="$TEST_DATABASE_URL" alembic downgrade base
      - name: pytest на PostgreSQL с покрытием
        run: >-
          python -m pytest -p no:cacheprovider
          --cov=app --cov-report=xml:coverage-pg.xml --cov-report=term:skip-covered --junitxml=junit-pg.xml
      - name: Сводка
        if: ${{ !cancelled() && hashFiles('backend/coverage-pg.xml') != '' }}
        run: python ../tools/ci/coverage_report.py --coverage coverage-pg.xml --junit junit-pg.xml --label "PostgreSQL 16"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: backend-postgres-results
          path: |
            backend/coverage-pg.xml
            backend/junit-pg.xml
          retention-days: 14
          if-no-files-found: ignore

  bank:
    name: Банк заданий · валидатор
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # ключи заданий frontend проверяются исполнением JavaScript, devops — bash и git
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: Валидатор (20 seed на семейство, 3 с исполнением ключа)
        run: python ../tools/ci/check_bank.py --seeds 20 --verify-seeds 3 --out "$RUNNER_TEMP/bank"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bank-validation-report
          path: ${{ runner.temp }}/bank
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Фронтенд · типы · сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: Проверка типов (tsc --noEmit)
        run: npm run typecheck
      - name: Сборка (tsc + vite build)
        run: npm run build
      - name: Размер сборки
        run: |
          {
            echo "### Фронтенд"
            echo
            echo "Сборка: $(du -sh dist | cut -f1); файлы ассетов:"
            echo
            echo '```'
            find dist/assets -type f -printf '%s %f\n' | sort -rn | awk '{printf "%8.1f КБ  %s\n", $1/1024, $2}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-local:
    name: Docker-образы · стек · e2e
    needs: [lint]
    uses: ./.github/workflows/e2e.yml
    with:
      target: local
