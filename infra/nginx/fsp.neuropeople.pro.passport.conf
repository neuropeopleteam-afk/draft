# Публичная проверка подписанного паспорта грейда: страница /verify/<id> открывается БЕЗ пароля стенда —
# работодатель вне платформы переходит по ссылке или QR-коду из PDF-профиля и видит «Действителен / Отозван /
# Истёк / Подпись не сходится». Данные страница берёт из /api/passport/<id> и /api/passport/keys, а /api/ и так
# открыт основным конфигом (у API своя авторизация). Подключается внутри server { listen 443 ssl; ... } сайта
# fsp.neuropeople.pro, рядом с фрагментом живой демонстрации (заголовки proxy_set_header заданы на уровне server).
#
# Установка на сервере (делает координатор). С веткой И10 (feat/infra2) — одной командой вместе с фрагментом QR:
#   sudo bash /opt/spectrek_fsp/app/infra/nginx/apply-public-snippets.sh   # сам проверит /verify/monitor-check → 200
# Вручную:
#   sudo cp infra/nginx/fsp.neuropeople.pro.passport.conf /etc/nginx/snippets/spectrek_fsp_passport.conf
#   в /etc/nginx/sites-available/fsp.neuropeople.pro внутри блока server 443 перед "location / {" добавить:
#       include /etc/nginx/snippets/spectrek_fsp_passport.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Зависимость: статика сборки (/assets/, /recover.js) открывается фрагментом живой демонстрации
# fsp.neuropeople.pro.jury-live.conf — без него страница проверки загрузится без JS и CSS. Здесь эти location
# не повторяются: два одинаковых location в одном server nginx не примет (nginx -t: duplicate location).
#
# Что открывается: только /verify/<id паспорта> — 8–32 символа base64url (id выпускается secrets.token_urlsafe(12),
# 16 символов; в API те же границы длины). Это тот же index.html SPA, без данных.
# Что НЕ открывается: /verify без слэша и /verify?… — страница подтверждения почты при регистрации (Verify.tsx);
# /verify/ без id и любые вложенные пути; остальной сайт остаётся за базовой авторизацией.
#
# Проверка после reload (ожидаемые коды):
#   curl -s -o /dev/null -w '%{http_code}\n' https://fsp.neuropeople.pro/verify/AAAAAAAAAAAAAAAA   # 200 (SPA; несуществующий id — «Паспорт не найден» на странице)
#   curl -s -o /dev/null -w '%{http_code}\n' https://fsp.neuropeople.pro/verify                    # 401 (почта — под паролем)
#   curl -s -o /dev/null -w '%{http_code}\n' https://fsp.neuropeople.pro/verify/                   # 401
#   curl -s -o /dev/null -w '%{http_code}\n' https://fsp.neuropeople.pro/api/passport/keys         # 200 (JWKS)
#
# Регулярное выражение (а не префикс ^~ /verify/) — чтобы без пароля открывались только адреса паспортов. Регулярные
# location в nginx проверяются раньше обычного префикса «location /», поэтому auth_basic off действует только здесь.

location ~ "^/verify/[A-Za-z0-9_-]{8,32}$" {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}

location = /.well-known/jwks.json {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}

# По желанию координатора (по умолчанию выключено): методика теста без пароля — на неё ведёт ссылка
# «Методика и проверка качества теста» со страницы проверки. Без этого блока внешний посетитель по ссылке
# получит запрос пароля стенда (жюри пароль знает). Данные методики приходят из /api/validation/*, он уже открыт.
# location = /validation {
#     auth_basic off;
#     proxy_pass http://127.0.0.1:8140;
# }
