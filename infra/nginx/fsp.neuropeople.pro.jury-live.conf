# Живая демонстрация для жюри (QR → мини-тест на телефоне): адреса, которые телефон эксперта открывает БЕЗ пароля
# стенда. Подключается внутри server { listen 443 ssl; ... } сайта fsp.neuropeople.pro перед «location / {»
# (заголовки proxy_set_header заданы на уровне server, auth_basic — только в «location /»).
#
# Установка на сервере — docs/ARCHITECTURE.md, раздел 11 (команды для координатора — <внутренний документ>):
#   sudo cp infra/nginx/fsp.neuropeople.pro.jury-live.conf /etc/nginx/snippets/spectrek_fsp_jury_live.conf
#   в /etc/nginx/sites-available/fsp.neuropeople.pro внутри server 443 перед «location / {» добавить строку
#       include /etc/nginx/snippets/spectrek_fsp_jury_live.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Что страница /j/<код> загружает (проверено 07.10 в Chromium на nginx 1.24 с копией конфига стенда, 390 и 1440 px):
#   /j/<код>[?source=pwa]          — index.html SPA (этот файл);
#   /assets/…                      — JS, CSS, шрифты Montserrat (woff2/woff) и чанки сборки (этот файл);
#   /recover.js                    — восстановление после выкладки, подключён в <head> (этот файл);
#   /sw.js, /manifest.webmanifest, /favicon.svg, /icons/… — уже открыты regex-location основного конфига;
#   /api/…                         — уже открыт (у API своя авторизация; гость — токен X-Guest-Token).
# Остальное (/, /employer, /jury/live, /validation, /verify без id, /j без кода) — под паролем, как раньше.
#
# Совместимость с фрагментом паспорта (И15б, fsp.neuropeople.pro.passport.conf, location /verify/<id>):
# /assets/ и /recover.js открывает ТОЛЬКО этот файл — повтор «location ^~ /assets/» в другом фрагменте даёт
# «duplicate location» и nginx -t не пройдёт. Паспорту нужен только свой location для /verify/<id>.
#
# Ограничение (честно): пароль стенда — «ворота» для полной загрузки страниц, а не защита данных. Загрузив SPA через
# /j/<код>, браузер может перейти по внутренним ссылкам без перезагрузки; данные при этом отдаёт только /api с JWT.

# Код зала — 3–16 букв и цифр (app/jury_live/service.py, CODE_ALPHABET; сейчас 6). Точное выражение, чтобы «/j»,
# «/j/» и «/j/a/b» не открывались (у prefix-location с proxy_pass nginx отвечает на «/j» редиректом 301 на «/j/»).
# Кавычки обязательны: без них nginx принимает «{» за начало блока.
location ~ "^/j/[A-Za-z0-9]{3,16}/?$" {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}

location ^~ /assets/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}

location = /recover.js {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}
