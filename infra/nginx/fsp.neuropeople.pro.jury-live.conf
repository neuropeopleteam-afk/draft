# Живая демонстрация для жюри (QR → мини-тест на телефоне): адреса, которые телефон эксперта
# открывает БЕЗ пароля стенда. Подключается внутри server { listen 443 ssl; ... } сайта
# fsp.neuropeople.pro — рядом с location /api/ (заголовки proxy_set_header там уже заданы на уровне server).
#
# Установка на сервере (делает владелец/координатор):
#   sudo cp fsp.neuropeople.pro.jury-live.conf /etc/nginx/snippets/spectrek_fsp_jury_live.conf
#   в /etc/nginx/sites-available/fsp.neuropeople.pro внутри блока server 443 перед "location / {" добавить:
#       include /etc/nginx/snippets/spectrek_fsp_jury_live.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Что открывается: /j/<код> — страница гостя (тот же index.html SPA, без данных: всё приходит из /api,
# который и так открыт); /assets/ и /recover.js — статика сборки (JS, CSS, шрифты), без неё страница не
# загрузится. Остальной сайт (/, /employer, /jury/live и т. д.) остаётся за базовой авторизацией.
# Манифест, sw.js, иконки и favicon уже открыты отдельным location в основном конфиге.

location ^~ /j/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}

location ^~ /assets/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}

location = /recover.js {
    auth_basic off;
    proxy_pass http://127.0.0.1:8140;
}
