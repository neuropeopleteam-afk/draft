server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    gzip on;
    gzip_http_version 1.0;   # внешний nginx проксирует по HTTP/1.0
    gzip_proxied any;        # сжимать и ответы API
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/wasm;
    # Я16: файлы сборки сжаты заранее (vite.config.ts, плагин precompress: рядом .gz уровня 9 и .br) — отдаём .gz как
    # есть: ответ с Content-Length (оборванную передачу браузер распознаёт как ошибку, сторож index.html повторяет
    # загрузку), сжатие сильнее «на лету» (418 → 334 КБ у прежнего основного файла) и без процессора на запрос.
    # .br в образе nginx:alpine не отдаётся (нет модуля ngx_brotli) — см. infra/nginx/BOOT_APPLY.md, шаг В.
    gzip_static on;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # ФСП ID (демо): Keycloak по пути /auth. Имя keycloak резолвится при запросе — web стартует и без Keycloak
    # (профиль fsp-id выключен → 502). Консоль администратора и realm master снаружи закрыты.
    location ^~ /auth/admin/ { return 403; }
    location ^~ /auth/realms/master/ { return 403; }
    location ^~ /auth/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_read_timeout 60s;
    }

    # PWA: service worker и манифест не кэшируются, чтобы обновления доходили сразу
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /icons/ {
        expires 7d;
        try_files $uri =404;
    }
    # В1: образ интервьюера и беззвучные клипы (INTERVIEW_AVATAR_ENABLED) — статика, кэш на неделю, нет файла — 404
    location /avatar/ {
        types {
            image/webp webp;
            video/webm webm;
            video/mp4 mp4;
            text/vtt vtt;
            text/markdown md;
        }
        default_type application/octet-stream;
        expires 7d;
        try_files $uri =404;
    }

    # Файлы сборки с хэшем в имени не меняются: кэш на год, один заголовок Cache-Control (раньше expires + add_header
    # давали два). Нет файла — 404, а не index.html (иначе браузер получил бы HTML вместо JS после выкладки).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # И16: модель анализа видео (MediaPipe) с нашего домена — версия в пути, кэш навсегда.
    # .mjs обязан отдаваться как JavaScript (иначе браузер не выполнит import), .wasm — как application/wasm
    # (иначе не работает потоковая компиляция WebAssembly), .tflite — бинарник.
    location /vendor/ {
        types {
            application/javascript js mjs;
            application/wasm wasm;
            application/octet-stream tflite;
            text/plain txt md;
        }
        default_type application/octet-stream;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html (и любой адрес SPA) — всегда сверка с сервером: после выкладки браузер сразу получает новые имена файлов.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
